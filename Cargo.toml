[package]
name = "ryf"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Evgeny Khodzitsky"]
description = "just wav. Pure-Rust WAVE family codec (RIFF/RIFX/RF64/BW64/Wave64 read; RIFF + RF64 PCM 8/16/24/32 + f32 write)."
readme = "README.md"
repository = "https://github.com/ekhodzitsky/ryf"
homepage = "https://github.com/ekhodzitsky/ryf"
documentation = "https://docs.rs/ryf"
keywords = ["wav", "riff", "audio", "pcm", "codec"]
categories = ["multimedia::audio"]
publish = false
autobenches = false

[features]
default = ["adpcm", "simd"]
# Microsoft + IMA/DVI ADPCM (0x0002 / 0x0011).
adpcm = []
# NEON (aarch64) + SSE4.1/SSE2 (x86) s16→f32 convert kernels.
simd = []
# Vendored dr_wav (C) for Criterion only. Needs a C compiler. Not product path.
bench-c = ["dep:cc"]

[dependencies]
# Intentionally empty — pure std.

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
wavers = "1.5"

[[bench]]
name = "wav"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
