[package]
name = "ryf"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Evgeny Khodzitsky"]
description = "Just wav. Pure-Rust WAVE family ingest: RIFF/RIFX/RF64/BW64/Wave64, G.711, G.722, ADPCM -> planar f32. Zero default deps."
readme = "README.md"
repository = "https://github.com/ekhodzitsky/ryf"
homepage = "https://github.com/ekhodzitsky/ryf"
documentation = "https://docs.rs/ryf"
keywords = ["wav", "riff", "pcm", "adpcm", "g711"]
categories = ["multimedia::audio"]
exclude = ["native/", ".github/"]
autobenches = false

[features]
default = ["adpcm", "simd"]
# Microsoft + IMA/DVI ADPCM (0x0002 / 0x0011).
adpcm = []
# NEON (aarch64) + SSE4.1/SSE2 (x86) s16->f32 convert kernels.
simd = []
# Vendored dr_wav (C) for Criterion only. Needs a C compiler. Not product path.
bench-c = ["dep:cc"]

[dependencies]
# Intentionally empty - pure std.

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
wavers = "1.5"

[[bench]]
name = "wav"
harness = false

[package.metadata.docs.rs]
# Default features only - `bench-c` needs a C compiler and vendored dr_wav.
rustdoc-args = ["--cfg", "docsrs"]
